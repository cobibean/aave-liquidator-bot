# One container PER CHAIN (speed plan 1.3). Previously all 5 chains shared a
# single Node event loop (Promise.all in bot.js), so one chain's CPU-bound burst
# (e.g. Base's ~210k-borrower COLD sweep decode) or an OOM could stall/kill the
# others and make us miss their block windows. Now each chain runs in its own
# container: its own process, its own V8 heap + heap cap, its own crash domain,
# its own RPC budget. A Base hiccup can no longer starve Arbitrum's hot path.
#
# All chain containers share the SAME .env (PRIVATE_KEY, TEST_MODE, per-chain
# addresses/RPCs) and the SAME named data volume (the borrower stores are
# per-chain FILES — borrowers-<chain>.json etc. — so there is no cross-chain
# collision). Each service overrides CHAINS to its single chain (CHAINS wins over
# CHAIN in src/chains.js, and `environment` overrides `env_file`, so this pins it).
#
# Per-chain heap caps fit the 4 GB droplet: Base biggest (full 210k COLD sweep),
# the rest smaller. Sum of --max-old-space-size = 2560 MB; mem_limit gives Docker
# a hard ceiling (~heap + non-heap overhead) so a runaway chain restarts cleanly
# instead of OOM-ing the host. The streaming sweep peaks ~130 MB even at 210k, so
# these caps are generous headroom, not tight fits.

x-bot-common: &bot-common
  build: .
  image: aave-liquidator-bot-aave-liquidator:latest
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - liquidator-data:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot-base:
    <<: *bot-common
    container_name: bot-base
    environment:
      CHAINS: "base"
      TEST_MODE: "${TEST_MODE:-true}"
      VERBOSE_HEALTH_LOGS: "${VERBOSE_HEALTH_LOGS:-false}"
    command: ["node", "--max-old-space-size=768", "bot.js"]
    mem_limit: 1024m

  bot-arbitrum:
    <<: *bot-common
    container_name: bot-arbitrum
    environment:
      CHAINS: "arbitrum"
      TEST_MODE: "${TEST_MODE:-true}"
      VERBOSE_HEALTH_LOGS: "${VERBOSE_HEALTH_LOGS:-false}"
    command: ["node", "--max-old-space-size=512", "bot.js"]
    mem_limit: 768m

  bot-optimism:
    <<: *bot-common
    container_name: bot-optimism
    environment:
      CHAINS: "optimism"
      TEST_MODE: "${TEST_MODE:-true}"
      VERBOSE_HEALTH_LOGS: "${VERBOSE_HEALTH_LOGS:-false}"
    command: ["node", "--max-old-space-size=512", "bot.js"]
    mem_limit: 768m

  bot-avalanche:
    <<: *bot-common
    container_name: bot-avalanche
    environment:
      CHAINS: "avalanche"
      TEST_MODE: "${TEST_MODE:-true}"
      VERBOSE_HEALTH_LOGS: "${VERBOSE_HEALTH_LOGS:-false}"
    command: ["node", "--max-old-space-size=384", "bot.js"]
    mem_limit: 640m

  bot-plasma:
    <<: *bot-common
    container_name: bot-plasma
    environment:
      CHAINS: "plasma"
      TEST_MODE: "${TEST_MODE:-true}"
      VERBOSE_HEALTH_LOGS: "${VERBOSE_HEALTH_LOGS:-false}"
    command: ["node", "--max-old-space-size=384", "bot.js"]
    mem_limit: 640m

  liquidator-monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    container_name: liquidator-monitor
    restart: unless-stopped
    user: "0:0"
    environment:
      MONITOR_HOST: "0.0.0.0"
      MONITOR_PORT: "8787"
      # With per-chain containers there is no single bot container; point the
      # dashboard at one by default (Base = heaviest/most interesting). Override
      # MONITOR_BOT_CONTAINER to watch a different chain. Borrower-store inspection
      # still covers all chains via the shared data volume below.
      MONITOR_BOT_CONTAINER: "${MONITOR_BOT_CONTAINER:-bot-base}"
      MONITOR_BORROWER_DATA_DIR: "/bot-data"
      MONITOR_STATUS_LOG_WINDOW: "${MONITOR_STATUS_LOG_WINDOW:-12h}"
      MONITOR_STALE_LOG_MINUTES: "${MONITOR_STALE_LOG_MINUTES:-30}"
      MONITOR_MAX_LOG_LINES: "${MONITOR_MAX_LOG_LINES:-2000}"
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8787}:8787"
    volumes:
      # Docker socket access lets the monitor inspect the named bot container and
      # read logs. Treat this as powerful host access even though the mount is
      # marked read-only, and expose the service only over private Tailscale.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - liquidator-data:/bot-data:ro

volumes:
  liquidator-data:
